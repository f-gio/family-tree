<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="5;url=https://lanostrastoria.web.app/">
  <title>La Nostra Storia — nouvelle adresse</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #26352d; background: #f7f5ef; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 38rem); padding: 2rem; box-sizing: border-box; border: 1px solid #d8ded8; border-radius: 1rem; background: #fffefa; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    a { color: #355f4a; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>La Nostra Storia a déménagé</h1>
    <p>Redirection vers la nouvelle adresse de production…</p>
    <p>Si la redirection ne fonctionne pas, <a id="firebase-link" href="https://lanostrastoria.web.app/">ouvrir La Nostra Storia sur Firebase Hosting</a>.</p>
  </main>
  <script>
    (() => {
      const destination = new URL("https://lanostrastoria.web.app/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      document.getElementById("firebase-link").href = destination.href;
      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
